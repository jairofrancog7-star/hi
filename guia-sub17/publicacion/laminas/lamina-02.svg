<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Rondo 4v1 de posesión</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Rondo 4v1 de posesión</text><text x="40" y="132.8" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Circular el balón con pases limpios bajo presión</text><text x="40" y="157.1" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">- Ficha: rondo-4v1-posesion</text><circle cx="44.0" cy="195.4" r="4" fill="#ff6a3d"/><text x="58.0" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 10 a 12 minutos en bloques de 2</text><text x="58.0" y="226.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">minutos. Jugadoras: Grupos de 5 (4 más 1).</text><circle cx="44.0" cy="252.8" r="4" fill="#ff6a3d"/><text x="58.0" y="258.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el pase vaya fuerte y a ras de piso, no</text><text x="58.0" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">botando.</text><circle cx="44.0" cy="310.2" r="4" fill="#ff6a3d"/><text x="58.0" y="316.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la receptora se oriente antes de que</text><text x="58.0" y="340.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">llegue el balón.</text><circle cx="44.0" cy="367.6" r="4" fill="#ff6a3d"/><text x="58.0" y="373.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se busque el tercer hombre: pasar a</text><text x="58.0" y="398.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">quien está más libre, no siempre a la de al</text><text x="58.0" y="423.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">lado.</text><circle cx="44.0" cy="449.7" r="4" fill="#ff6a3d"/><text x="58.0" y="455.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: rondo 4v1 ejercicio de posesión:</text><text x="58.0" y="480.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="505.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=rondo+4v1+entrenamiento+futbol+ejercicio</text></svg>