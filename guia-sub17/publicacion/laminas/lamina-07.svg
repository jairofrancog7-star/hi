<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Ataque por bandas: desborde y centro</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Ataque por bandas:</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">desborde y centro</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ganar la espalda de la lateral y meter el balón</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">al área - Ficha: ataque-bandas-desborde-centro</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 a 18 minutos. Jugadoras: Grupos</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">de extrema, lateral y 3 rematadoras.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la extrema levante la cabeza antes de</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">centrar.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el centro tenga destino (primer palo,</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">punto de penal o segundo palo), no un balón</text><text x="58.0" y="406.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">al bulto.</text><circle cx="44.0" cy="433.1" r="4" fill="#ff6a3d"/><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que las rematadoras lleguen en movimiento y</text><text x="58.0" y="463.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">ataquen espacios distintos.</text><circle cx="44.0" cy="490.5" r="4" fill="#ff6a3d"/><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: ataque por banda y centro al área:</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=ejercicio+ataque+por+banda+centro+al+area+f</text><text x="58.0" y="570.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">utbol</text></svg>