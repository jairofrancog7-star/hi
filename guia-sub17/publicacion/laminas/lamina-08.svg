<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Finalización bajo presión 1v1</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Finalización bajo presión</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">1v1</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Definir con una defensora encima y poco tiempo -</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ficha: finalizacion-bajo-presion-1v1</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 a 15 minutos. Jugadoras:</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Parejas atacante-defensora en rotación, más</text><text x="58.0" y="291.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">portera.</text><circle cx="44.0" cy="318.3" r="4" fill="#ff6a3d"/><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se remate rápido, sin dar tiempo a que</text><text x="58.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">llegue la defensora.</text><circle cx="44.0" cy="375.7" r="4" fill="#ff6a3d"/><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se busque colocación al palo largo antes</text><text x="58.0" y="406.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">que un pelotazo.</text><circle cx="44.0" cy="433.1" r="4" fill="#ff6a3d"/><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el primer toque oriente el balón hacia</text><text x="58.0" y="463.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">la portería.</text><circle cx="44.0" cy="490.5" r="4" fill="#ff6a3d"/><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: finalización 1v1 y definición bajo</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">presión:</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="570.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=ejercicio+finalizacion+1v1+definicion+bajo+</text><text x="58.0" y="595.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">presion</text></svg>