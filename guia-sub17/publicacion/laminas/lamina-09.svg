<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Duelos aéreos y cabeceo</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Duelos aéreos y cabeceo</text><text x="40" y="132.8" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ganar el balón por alto con salto y técnica</text><text x="40" y="157.1" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">seguros - Ficha: duelos-aereos-cabeceo</text><circle cx="44.0" cy="195.4" r="4" fill="#ff6a3d"/><text x="58.0" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 minutos. Jugadoras: Parejas y</text><text x="58.0" y="226.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">luego grupos con centrador.</text><circle cx="44.0" cy="252.8" r="4" fill="#ff6a3d"/><text x="58.0" y="258.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el impacto sea con la frente y los ojos</text><text x="58.0" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">abiertos.</text><circle cx="44.0" cy="310.2" r="4" fill="#ff6a3d"/><text x="58.0" y="316.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el salto tenga buen timing, golpeando el</text><text x="58.0" y="340.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">balón en el punto más alto.</text><circle cx="44.0" cy="367.6" r="4" fill="#ff6a3d"/><text x="58.0" y="373.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que en ataque se cabecee hacia abajo y en</text><text x="58.0" y="398.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">defensa hacia arriba y lejos.</text><circle cx="44.0" cy="425.0" r="4" fill="#ff6a3d"/><text x="58.0" y="431.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: técnica de cabeceo y duelos</text><text x="58.0" y="455.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">aéreos:</text><text x="58.0" y="480.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="505.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=tecnica+de+cabeceo+futbol+entrenamiento+pro</text><text x="58.0" y="529.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">gresion</text></svg>