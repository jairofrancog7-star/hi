<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Ruptura de líneas: pases filtrados y desmarques</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Ruptura de líneas: pases</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">filtrados y desmarques</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Coordinar el pase entre líneas con el movimiento</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">de ataque - Ficha: ruptura-lineas-pases-filtrados</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 minutos. Jugadoras: Grupos de</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">mediocampistas y delanteras, con defensoras</text><text x="58.0" y="291.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">pasivas o semiactivas.</text><circle cx="44.0" cy="318.3" r="4" fill="#ff6a3d"/><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el pase vaya al espacio, delante de la</text><text x="58.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">corredora.</text><circle cx="44.0" cy="375.7" r="4" fill="#ff6a3d"/><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el desmarque sea en diagonal y ataque la</text><text x="58.0" y="406.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">espalda de la defensa.</text><circle cx="44.0" cy="433.1" r="4" fill="#ff6a3d"/><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que pase y desmarque ocurran al mismo tiempo</text><text x="58.0" y="463.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">(timing).</text><circle cx="44.0" cy="490.5" r="4" fill="#ff6a3d"/><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: pases filtrados y ruptura de</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">líneas:</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="570.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=pase+filtrado+ruptura+de+lineas+desmarque+e</text><text x="58.0" y="595.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">ntrenamiento</text></svg>