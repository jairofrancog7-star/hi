<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Balón parado defensivo: marcaje zonal y mixto</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Balón parado defensivo:</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">marcaje zonal y mixto</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Defender córners y tiros de esquina sin conceder</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">- Ficha: balon-parado-defensivo-marcaje</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 minutos. Jugadoras: Bloque</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">defensivo completo más portera y equipo</text><text x="58.0" y="291.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">atacante de apoyo.</text><circle cx="44.0" cy="318.3" r="4" fill="#ff6a3d"/><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que los palos estén siempre cubiertos hasta</text><text x="58.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">que pase el peligro.</text><circle cx="44.0" cy="375.7" r="4" fill="#ff6a3d"/><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que las zonales salten hacia adelante a</text><text x="58.0" y="406.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">atacar el balón.</text><circle cx="44.0" cy="433.1" r="4" fill="#ff6a3d"/><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que las marcadoras no pierdan de vista a su</text><text x="58.0" y="463.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">rematadora asignada.</text><circle cx="44.0" cy="490.5" r="4" fill="#ff6a3d"/><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: defensa de córner con marcaje</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">zonal y mixto:</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="570.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=defensa+corner+marcaje+zonal+mixto+futbol</text></svg>