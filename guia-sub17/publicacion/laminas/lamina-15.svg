<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Distribución de la portera</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Distribución de la portera</text><text x="40" y="132.8" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Iniciar el juego con los pies y con las manos -</text><text x="40" y="157.1" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ficha: distribucion-de-la-portera</text><circle cx="44.0" cy="195.4" r="4" fill="#ff6a3d"/><text x="58.0" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 minutos. Jugadoras: Portera con</text><text x="58.0" y="226.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">centrales, laterales y mediocentro; una</text><text x="58.0" y="250.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">atacante que presiona.</text><circle cx="44.0" cy="277.5" r="4" fill="#ff6a3d"/><text x="58.0" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la portera elija la opción correcta</text><text x="58.0" y="308.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">según la presión rival.</text><circle cx="44.0" cy="334.9" r="4" fill="#ff6a3d"/><text x="58.0" y="340.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el saque con los pies sea raso y preciso</text><text x="58.0" y="365.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">a la central abierta.</text><circle cx="44.0" cy="392.3" r="4" fill="#ff6a3d"/><text x="58.0" y="398.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el lanzamiento con las manos vaya rodado</text><text x="58.0" y="423.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">cuando se busca construir.</text><circle cx="44.0" cy="449.7" r="4" fill="#ff6a3d"/><text x="58.0" y="455.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: distribución y saque de la</text><text x="58.0" y="480.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">portera:</text><text x="58.0" y="505.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="529.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=distribucion+portera+saque+pies+manos+entre</text><text x="58.0" y="554.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">namiento</text></svg>