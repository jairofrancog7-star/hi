<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Golpeo con el exterior: pases y conducción con efecto</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Golpeo con el exterior:</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">pases y conducción con</text><text x="40" y="165.6" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">efecto</text><text x="40" y="214.4" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">La parte de fuera del pie para sorprender -</text><text x="40" y="238.7" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ficha: golpeo-exterior-pase-conduccion</text><circle cx="44.0" cy="277.0" r="4" fill="#ff6a3d"/><text x="58.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 10 a 12 minutos. Jugadoras:</text><text x="58.0" y="307.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Parejas y grupos pequeños.</text><circle cx="44.0" cy="334.4" r="4" fill="#ff6a3d"/><text x="58.0" y="340.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el pie gire hacia adentro para presentar</text><text x="58.0" y="365.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">el exterior.</text><circle cx="44.0" cy="391.8" r="4" fill="#ff6a3d"/><text x="58.0" y="397.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el pase con exterior sea un gesto corto</text><text x="58.0" y="422.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">y seco, sin telegrafiar.</text><circle cx="44.0" cy="449.2" r="4" fill="#ff6a3d"/><text x="58.0" y="455.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que en conducción el balón se empuje con el</text><text x="58.0" y="479.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">exterior sin frenar la carrera.</text><circle cx="44.0" cy="506.6" r="4" fill="#ff6a3d"/><text x="58.0" y="512.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: golpeo y conducción con el</text><text x="58.0" y="537.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">exterior del pie:</text><text x="58.0" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="586.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=golpeo+con+el+exterior+del+pie+efecto+condu</text><text x="58.0" y="611.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">ccion</text></svg>