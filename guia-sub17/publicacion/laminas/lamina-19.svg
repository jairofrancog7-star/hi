<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Pase largo y cambio de orientación</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Pase largo y cambio de</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">orientación</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Cambiar el juego de banda con un envío preciso -</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ficha: pase-largo-cambio-orientacion</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 a 15 minutos. Jugadoras: Grupos</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">de 4 a 6 repartidos por el ancho del campo.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se mire al campo antes de recibir para</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">elegir el destino.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el golpeo dé la altura justa, ni rasante</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">ni demasiado alto.</text><circle cx="44.0" cy="408.4" r="4" fill="#ff6a3d"/><text x="58.0" y="414.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el balón caiga jugable, a los pies o al</text><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">espacio de carrera.</text><circle cx="44.0" cy="465.8" r="4" fill="#ff6a3d"/><text x="58.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: pase largo y cambio de</text><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">orientación:</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=pase+largo+cambio+de+orientacion+tecnica+fu</text><text x="58.0" y="570.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">tbol</text></svg>