<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Control orientado: recibir de cara al juego</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Control orientado: recibir</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">de cara al juego</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">El primer toque que te ahorra un tiempo - Ficha:</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">control-orientado-recepcion</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 10 minutos. Jugadoras: Grupos de</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">3: pasadora, receptora y marcadora pasiva.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se mire el espacio antes de recibir, no</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">después.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el cuerpo esté semiabierto hacia el</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">campo al controlar.</text><circle cx="44.0" cy="408.4" r="4" fill="#ff6a3d"/><text x="58.0" y="414.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el primer toque lleve el balón al</text><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">espacio libre, no lo deje muerto.</text><circle cx="44.0" cy="465.8" r="4" fill="#ff6a3d"/><text x="58.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: control orientado y primer toque:</text><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=control+orientado+primer+toque+recepcion+fu</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">tbol</text></svg>