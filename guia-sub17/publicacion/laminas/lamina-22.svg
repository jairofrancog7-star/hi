<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Postura para pasar y tirar</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Postura para pasar y tirar</text><text x="40" y="132.8" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">El cuerpo bien colocado hace fácil lo difícil -</text><text x="40" y="157.1" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ficha: postura-para-pasar-y-tirar</text><circle cx="44.0" cy="195.4" r="4" fill="#ff6a3d"/><text x="58.0" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 8 a 10 minutos. Jugadoras:</text><text x="58.0" y="226.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Parejas.</text><circle cx="44.0" cy="252.8" r="4" fill="#ff6a3d"/><text x="58.0" y="258.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el pie de apoyo apunte al objetivo y</text><text x="58.0" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">esté al lado del balón.</text><circle cx="44.0" cy="310.2" r="4" fill="#ff6a3d"/><text x="58.0" y="316.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la rodilla de apoyo esté flexionada para</text><text x="58.0" y="340.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">dar estabilidad.</text><circle cx="44.0" cy="367.6" r="4" fill="#ff6a3d"/><text x="58.0" y="373.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el tronco esté sobre el balón en los</text><text x="58.0" y="398.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">tiros rasos.</text><circle cx="44.0" cy="425.0" r