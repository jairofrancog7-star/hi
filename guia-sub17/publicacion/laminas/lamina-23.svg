<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Conducción con cambios de ritmo</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Conducción con cambios de</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">ritmo</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Llevar el balón pegado y arrancar cuando quieras</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">- Ficha: conduccion-cambios-de-ritmo</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 10 a 12 minutos. Jugadoras: Grupos</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">en circuito, salidas cada pocos segundos.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el balón vaya pegado al pie en la</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">conducción lenta.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la cabeza se levante entre toques para</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">leer el campo.</text><circle cx="44.0" cy="408.4" r="4" fill="#ff6a3d"/><text x="58.0" y="414.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el arranque explosivo salga desde un</text><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">toque un poco más largo al espacio.</text><circle cx="44.0" cy="465.8" r="4" fill="#ff6a3d"/><text x="58.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: conducción con cambios de ritmo:</text><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=conduccion+cambio+de+ritmo+balon+entrenamie</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">nto+futbol</text></svg>