<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Salto y aterrizaje seguro</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Salto y aterrizaje seguro</text><text x="40" y="132.8" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Caer bien para proteger la rodilla - Ficha:</text><text x="40" y="157.1" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">salto-aterrizaje-seguro</text><circle cx="44.0" cy="195.4" r="4" fill="#ff6a3d"/><text x="58.0" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 8 a 10 minutos. Jugadoras: Todo el</text><text x="58.0" y="226.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">plantel, con espacio individual.</text><circle cx="44.0" cy="252.8" r="4" fill="#ff6a3d"/><text x="58.0" y="258.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la caída amortigüe flexionando tobillo,</text><text x="58.0" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">rodilla y cadera.</text><circle cx="44.0" cy="310.2" r="4" fill="#ff6a3d"/><text x="58.0" y="316.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que las rodillas queden alineadas sobre las</text><text x="58.0" y="340.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">puntas, nunca hacia adentro.</text><circle cx="44.0" cy="367.6" r="4" fill="#ff6a3d"/><text x="58.0" y="373.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se domine la caída a dos piernas antes</text><text x="58.0" y="398.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">de pasar a una.</text><