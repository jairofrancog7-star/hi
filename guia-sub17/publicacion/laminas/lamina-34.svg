<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Desmarque de ruptura por detrás de la defensa</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Desmarque de ruptura por</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">detrás de la defensa</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Atacar el espacio en el momento justo - Ficha:</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">desmarque-de-ruptura</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 a 15 minutos. Jugadoras: Grupos</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">con portadoras, atacantes de ruptura y línea</text><text x="58.0" y="291.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">defensiva.</text><circle cx="44.0" cy="318.3" r="4" fill="#ff6a3d"/><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la ruptura arranque cuando la portadora</text><text x="58.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">puede dar el pase.</text><circle cx="44.0" cy="375.7" r="4" fill="#ff6a3d"/><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la carrera sea en diagonal al hueco, no</text><text x="58.0" y="406.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">en recto.</text><circle cx="44.0" cy="433.1" r="4" fill="#ff6a3d"/><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se respete la línea para no caer en</text><text x="58.0" y="463.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">fuera de juego.</text><circle cx="44.0" cy="490.5" r="4" fill="#ff6a3d"/><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: desmarque de ruptura y ataque al</text><text x="58.0" y="521.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">espacio:</text><text x="58.0" y="545.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="570.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=desmarque+de+ruptura+pase+filtrado+espacio+</text><text x="58.0" y="595.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">futbol</text></svg>