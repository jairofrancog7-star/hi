<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Juego por posición: la mediocentro</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Juego por posición: la</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">mediocentro</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">El pivote que ordena y reparte el juego - Ficha:</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">juego-posicion-mediocentro</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 minutos. Jugadoras: Mediocentro</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">con defensa, interiores y rivales.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que se ofrezca siempre como opción de pase.</text><circle cx="44.0" cy="326.3" r="4" fill="#ff6a3d"/><text x="58.0" y="332.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que reciba de perfil para ver todo el campo.</text><circle cx="44.0" cy="359.0" r="4" fill="#ff6a3d"/><text x="58.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el primer pase sea seguro y oriente el</text><text x="58.0" y="389.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">juego.</text><circle cx="44.0" cy="416.4" r="4" fill="#ff6a3d"/><text x="58.0" y="422.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: juego de la mediocentro:</text><text x="58.0" y="447.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=mediocentro+pivote+recibir+orientar+juego+e</text><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">ntrenamiento+futbol</text></svg>