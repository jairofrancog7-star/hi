<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Pase corto con interior, preciso y bajo presión</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Pase corto con interior,</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">preciso y bajo presión</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Entregar al pie de la compañera con una rival</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">encima - Ficha: pase-corto-interior-presion</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 minutos. Jugadoras: 2 a 8</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">jugadoras.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el pie de apoyo apunte al destino antes</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">del golpeo.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el contacto sea con el interior y el</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">balón salga raso.</text><circle cx="44.0" cy="408.4" r="4" fill="#ff6a3d"/><text x="58.0" y="414.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la cabeza suba a mirar antes de recibir.</text><circle cx="44.0" cy="441.1" r="4" fill="#ff6a3d"/><text x="58.0" y="447.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Video de ejemplo:</text><text x="58.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.tiktok.com/@chilena_tvv</text><circle cx="44.0" cy="498.5" r="4" fill="#ff6a3d"/><text x="58.0" y="504.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: pase corto con interior bajo</text><text x="58.0" y="529.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">presión:</text><text x="58.0" y="553.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="578.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=pase+corto+interior+precision+bajo+presion+</text><text x="58.0" y="603.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">futbol</text></svg>