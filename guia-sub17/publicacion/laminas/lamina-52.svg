<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Pase largo con empeine para cambiar de orientación</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Pase largo con empeine</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">para cambiar de</text><text x="40" y="165.6" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">orientación</text><text x="40" y="214.4" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Mandar el juego a la banda contraria con un</text><text x="40" y="238.7" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">golpeo firme - Ficha:</text><text x="40" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">pase-largo-empeine-orientacion</text><circle cx="44.0" cy="301.3" r="4" fill="#ff6a3d"/><text x="58.0" y="307.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 minutos. Jugadoras: 2 a 8</text><text x="58.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">jugadoras.</text><circle cx="44.0" cy="358.7" r="4" fill="#ff6a3d"/><text x="58.0" y="364.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el toque de preparación deje el balón</text><text x="58.0" y="389.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">fuera del cuerpo.</text><circle cx="44.0" cy="416.1" r="4" fill="#ff6a3d"/><text x="58.0" y="422.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la cabeza se levante para ver la banda</text><text x="58.0" y="446.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">contraria antes de golpear.</text><circle cx="44.0" cy="473.5" r="4" fill="#ff6a3d"/><text x="58.0" y="479.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el contacto sea de empeine y la</text><text x="58.0" y="504.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">trayectoria sea la elegida.</text><circle cx="44.0" cy="530.9" r="4" fill="#ff6a3d"/><text x="58.0" y="536.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Video de ejemplo:</text><text x="58.0" y="561.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.tiktok.com/@chilena_tvv</text><circle cx="44.0" cy="588.3" r="4" fill="#ff6a3d"/><text x="58.0" y="594.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: pase largo y cambio de</text><text x="58.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">orientación:</text><text x="58.0" y="643.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="668.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=pase+largo+empeine+cambio+de+orientacion+fu</text><text x="58.0" y="693.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">tbol</text></svg>