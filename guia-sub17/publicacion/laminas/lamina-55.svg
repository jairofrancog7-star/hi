<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Regate con cambio de dirección y salida acelerada</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Regate con cambio de</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">dirección y salida</text><text x="40" y="165.6" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">acelerada</text><text x="40" y="214.4" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Romper la marca y arrancar fuerte en el primer</text><text x="40" y="238.7" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">paso - Ficha: regate-cambio-direccion-salida</text><circle cx="44.0" cy="277.0" r="4" fill="#ff6a3d"/><text x="58.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 minutos. Jugadoras: 1 a 8</text><text x="58.0" y="307.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">jugadoras.</text><circle cx="44.0" cy="334.4" r="4" fill="#ff6a3d"/><text x="58.0" y="340.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el cambio de dirección se haga cerca de</text><text x="58.0" y="365.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">la defensora, no antes.</text><circle cx="44.0" cy="391.8" r="4" fill="#ff6a3d"/><text x="58.0" y="397.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el centro de gravedad baje antes del</text><text x="58.0" y="422.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">cambio.</text><circle cx="44.0" cy="449.2" r="4" fill="#ff6a3d"/><text x="58.0" y="455.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la salida sea con pasos cortos y</text><text x="58.0" y="479.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">rápidos.</text><circle cx="44.0" cy="506.6" r="4" fill="#ff6a3d"/><text x="58.0" y="512.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Video de ejemplo:</text><text x="58.0" y="537.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.tiktok.com/@chilena_tvv</text><circle cx="44.0" cy="564.0" r="4" fill="#ff6a3d"/><text x="58.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: regate con cambio de dirección:</text><text x="58.0" y="594.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="619.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=regate+cambio+de+direccion+salida+acelerada</text><text x="58.0" y="644.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">+futbol</text></svg>