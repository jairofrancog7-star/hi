<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Control orientado en un solo toque</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Control orientado en un</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">solo toque</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Dejar el balón a punto para jugar sin llegar a</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">frenarlo - Ficha: control-orientado-un-toque</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 10 minutos. Jugadoras: 2 a 8</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">jugadoras.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la cabeza se levante antes de que llegue</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">el balón.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el cuerpo se ponga de perfil hacia el</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">espacio libre.</text><circle cx="44.0" cy="408.4" r="4" fill="#ff6a3d"/><text x="58.0" y="414.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que reciba con el pie lejano a la rival.</text><circle cx=