<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Bajar balones altos con planta, muslo y pecho</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Bajar balones altos con</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">planta, muslo y pecho</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Amortiguar el balón que cae y dejarlo a punto en</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">el piso - Ficha:</text><text x="40" y="222.2" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">bajar-balones-altos-planta-muslo-pecho</text><circle cx="44.0" cy="260.5" r="4" fill="#ff6a3d"/><text x="58.0" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 12 minutos. Jugadoras: 2 a 8</text><text x="58.0" y="291.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">jugadoras.</text><circle cx="44.0" cy="317.9" r="4" fill="#ff6a3d"/><text x="58.0" y="323.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el cuerpo se coloque debajo de la caída</text><text x="58.0" y="348.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">del balón.</text><circle cx="44.0" cy="375.3" r="4" fill="#ff6a3d"/><text x="58.0" y="381.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la superficie se retire en el contacto</text><text x="58.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">en vez de golpear.</text><circle cx="44.0" cy="432.7" r="4" fill="#ff6a3d"/><text x="58.0" y="438.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que el balón quede a menos de un metro.</text><circle cx="44.0" cy="465.4" r="4" fill="#ff6a3d"/><text x="58.0" y="471.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Video de ejemplo:</text><text x="58.0" y="496.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.tiktok.com/@chilena_tvv</text><circle cx="44.0" cy="522.8" r="4" fill="#ff6a3d"/><text x="58.0" y="528.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: amortiguar balones altos:</text><text x="58.0" y="553.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="578.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=bajar+balones+altos+amortiguar+muslo+pecho+</text><text x="58.0" y="602.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">futbol</text></svg>