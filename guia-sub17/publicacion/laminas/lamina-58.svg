<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" preserveAspectRatio="xMidYMid meet"><title>Conducción en carrera y definición ante la portera</title><rect x="0" y="0" width="540" height="960" fill="#141018"/><rect x="40" y="40" width="64" height="6" rx="3" fill="#ff6a3d"/><text x="40" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">Conducción en carrera y</text><text x="40" y="124.8" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ff2e88">definición ante la portera</text><text x="40" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Correr con el balón y resolver el mano a mano -</text><text x="40" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e7e2ea">Ficha: conduccion-carrera-definicion</text><circle cx="44.0" cy="236.2" r="4" fill="#ff6a3d"/><text x="58.0" y="242.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Duracion: 15 minutos. Jugadoras: 1 a 8</text><text x="58.0" y="266.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">jugadoras.</text><circle cx="44.0" cy="293.6" r="4" fill="#ff6a3d"/><text x="58.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la cabeza suba a mirar la portería</text><text x="58.0" y="324.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">durante la conducción.</text><circle cx="44.0" cy="351.0" r="4" fill="#ff6a3d"/><text x="58.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que los toques se acorten cuando la portera</text><text x="58.0" y="381.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">sale.</text><circle cx="44.0" cy="408.4" r="4" fill="#ff6a3d"/><text x="58.0" y="414.4" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Que la decisión esté tomada antes de entrar</text><text x="58.0" y="439.1" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">al área.</text><circle cx="44.0" cy="465.8" r="4" fill="#ff6a3d"/><text x="58.0" y="471.8" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Video de ejemplo:</text><text x="58.0" y="496.5" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.tiktok.com/@chilena_tvv</text><circle cx="44.0" cy="523.2" r="4" fill="#ff6a3d"/><text x="58.0" y="529.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">Búsqueda: conducción en carrera y</text><text x="58.0" y="553.9" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">definición:</text><text x="58.0" y="578.6" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">https://www.youtube.com/results?search_query</text><text x="58.0" y="603.3" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">=conduccion+en+carrera+definicion+mano+a+man</text><text x="58.0" y="628.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9c3cf">o+futbol</text></svg>